 8A): Inherited Superclass PK/FK`,description:`Key inherited from the superclass '{{superTableName}}' acting as PK and FK in the subclass.`},STEP8A_FK_LINK:{title:`Step 8 (Option 8A): Inheritance FK Link`,description:`Inheritance constraint linking the subclass '{{subTableName}}' to its superclass '{{superTableName}}' with ON DELETE CASCADE: the subclass row is part of the same entity as the superclass row.`},STEP8_DEFINING_ATTR:{title:`Step 8: Specialization Defining Attribute`,description:`Column for the defining attribute '{{attrLabel}}' in the superclass '{{superTableName}}': its value determines which subclass each row belongs to (attribute-defined specialization).`},STEP9_CATEGORY_TABLE:{title:`Step 9: Category Mapping (Union Type)`,description:`Category table '{{categoryTableName}}' is created with its artificial surrogate key as PK.`},STEP9_FK_CATEGORY:{title:`Step 9: Union Category FK (Case 9.1)`,description:`Foreign key linking the superclass '{{superTableName}}' to the surrogate category '{{categoryTableName}}'.`},STEP9_FK_CONSTRAINT:{title:`Step 9: Category FK Constraint`,description:`Referential integrity linking the superclass to the category '{{categoryTableName}}'.`},DSL_TABLE:{title:`DSL Relational Table`,description:`Table '{{tableName}}' defined via the relational text DSL.`}}},on={es:{1:{title:`Paso 1: Entidades Fuertes`,description:`Por cada tipo de entidad fuerte E, se crea una relación (tabla) R. Los atributos simples se incluyen directamente como columnas. La clave primaria de E se convierte en la PK de R.`},2:{title:`Paso 2: Entidades Débiles`,description:`Se crea una tabla para la entidad débil W. Se propaga la PK de la entidad propietaria como FK y se combina con la clave parcial de W para formar su PK compuesta. La FK usa ON DELETE CASCADE porque W no puede existir sin su propietaria.`},3:{title:`Paso 3: Relaciones Binarias 1:1`,description:`Se elige la relación con participación total e incluye como FK la clave primaria de la otra tabla, ### Reglas de Sintaxis de EER Studio:

**IMPORTANTE:** Todos los elementos (entidades, atributos, relaciones, jerarquías) pueden llevar coordenadas opcionales: \`ELEMENTO NOMBRE (x, y)\`
**Longitud:** Usa nombres de entidades/atributos/relaciones con ≤15 caracteres para que quepan en las elipses/rectángulos.

1) Entidades
- Fuerte: \`ent EMPLEADO (100, 200)\`
- Débil: \`weak_ent CONTRATO (150, 350)\`

2) Atributos
- Simple: \`att Nombre -> EMPLEADO (120, 80)\` (alejado de la entidad)
- Clave: \`key_att DNI -> EMPLEADO (50, 80)\`
- Derivado: \`derived_att Edad -> EMPLEADO (190, 80)\`
- Multivaluado: \`multivalued_att Telefono -> EMPLEADO (260, 80)\`
- De relación: \`att Fecha -> TRABAJA_EN (250, 120)\` (la flecha apunta a la relación). Si es clave (\`key_att\`) en una relación M:N o n-aria, forma parte de la PK de la tabla de la relación (ej. \`key_att Vuelta -> CIRCULA\`)

3) Relaciones
- Normal: \`rel TRABAJA_EN (250, 200)\` (centrada entre entidades)
- Identificativa: \`ident_rel POSEE (200, 350)\` (para entidad débil)

4) Conexiones

6) Uniones (categorías)

- Conectar superclases: \`link SUPERCLASE u\`

### 📏 Guía de espaciado para evitar solapes
- Atributos en fila superior: Y = entidad_Y - 130 a -160; máx 4 por fila; X +100px entre atributos; si hay más, abre segunda fila superior 40–60px más arriba y resetea X.

- Strong: \`ent EMPLOYEE (100, 200)\`
- Weak: \`weak_ent CONTRACT (150, 350)\`

- Simple: \`att Name -> EMPLOYEE (120, 80)\` (away from the entity)
- Key: \`key_att SSN -> EMPLOYEE (50, 80)\`
- Derived: \`derived_att Age -> EMPLOYEE (190, 80)\`
- Multivalued: \`multivalued_att Phone -> EMPLOYEE (260, 80)\`
- Relationship attribute: \`att Date -> WORKS_IN (250, 120)\` (the arrow points to the relationship). If it is a key (\`key_att\`) in an M:N or n-ary relationship, it becomes part of the PK of the relationship table (e.g. \`key_att Lap -> RACES\`)

- Regular: \`rel WORKS_IN (250, 200)\` (centred between entities)
- Identifying: \`ident_rel OWNS (200, 350)\` (for a weak entity)

- Syntax: \`link ENTITY RELATIONSHIP "CARDINALITY" [optional:total]\`
- Example: \`link EMPLOYEE WORKS_IN "N" [total]\`
