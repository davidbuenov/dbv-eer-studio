der.help":`Ayuda`,"header.helpTooltip":`Ayuda: uso del editor, sintaxis, 9 pasos, prompt IA y créditos (F1)`,"help.title":`Centro de Ayuda`,"help.subtitle":`Todo lo necesario para usar EER Studio`,"help.tab.usage":`Uso del editor`,"help.tab.syntax":`Sintaxis`,"help.tab.steps":`Guía de 9 Pasos`,"help.tab.aiPrompt":`Prompt IA`,"help.tab.about":`Acerca de`,"help.close":`Cerrar`,"help.f1Hint":`Pulsa F1 en cualquier momento para abrir esta ayuda.`,"help.usage.intro":`EER Studio sincroniza el diagrama y el código DSL en ambos sentidos: puedes trabajar con el ratón, con el teclado o combinando ambos.`,"help.usage.col.gesture":`Gesto`,"help.usage.col.action":`Qué hace`,"help.usage.create.title":`Crear elementos`,"help.usage.create.tool.g":`Botón de la barra + clic en el lienzo`,"help.usage.create.tool.d":`Abre un formulario para configurar la entidad, relación, atributo, especialización o unión en ese punto. Si antes seleccionas una entidad, relación o atributo, el atributo nuevo aparece ya asociado a él en «Pertenece a».`,"help.usage.create.another.g":`«Añadir y crear otro»`,"help.usage.create.another.d":`En el formulario de atributo: lo añade y deja el formulario listo para el siguiente del mismo propietario (entidad, relación o atributo compuesto), 100 px a la derecha.`,"help.usage.create.attrTypes.g":`Tipo de atributo: clave parcial y clave alternativa`,"help.usage.create.attrTypes.d":`«Clave parcial» es la clave de una entidad débil (subrayado discontinuo). Con el tipo «Clave», la casilla «Clave alternativa (UNIQUE)» marca una clave que no es la primaria (UK en el diagrama, NOT NULL + UNIQUE en el modelo relacional).`,"help.usage.create.specPartial.g":`Especialización: «Participación total»`,"help.usage.create.specPartial.d":`Marcada (por defecto), toda entidad de la superclase pertenece a alguna subclase: doble línea. Desmárcala para una especialización parcial: línea simple.`,"help.usage.create.relAttr.g":`Atributo → «Pertenece a» una relación`,"help.usage.create.relAttr.d":`Crea atributos de relación. Si son clave en una relación M:N o n-aria, entran en la PK de su tabla.`,"help.usage.create.composite.g":`Atributo → «Pertenece a» otro atributo`,"help.usage.create.composite.d":`Crea un atributo compuesto: primero el compuesto (Direccion) colgado de la entidad y después cada componente (Calle, Numero) colgado de él. Lo más rápido: selecciona Direccion en el diagrama y usa «Añadir y crear otro». En el modelo relacional el compuesto se sustituye por sus componentes.`,"help.usage.create.nary.g":`Relación → «+ Añadir entidad»`,"help.usage.create.nary.d":`Crea o edita relaciones ternarias y de mayor grado. Cada participante tiene cardinalidad, participación total y rol opcional (útil en relaciones recursivas).`,"help.usage.create.code.g":`Escribir en el panel de código`,"help.usage.create.code.d":`El diagrama se redibuja al instante. Consulta la pestaña Sintaxis.`,"help.usage.select.title":`Seleccionar`,"help.usage.select.click.g":`Clic en un elemento`,"help.usage.select.click.d":`Lo selecciona y resalta sus líneas en el código.`,"help.usage.select.ctrlClick.g":`Ctrl + clic`,"help.usage.select.ctrlClick.d":`Añade o quita el elemento de la selección.`,"help.usage.select.rect.g":`Arrastrar en el fondo`,"help.usage.select.rect.d":`Dibuja un rectángulo y selecciona los elementos que quedan enteros dentro.`,"help.usage.select.ctrlRect.g":`Ctrl + arrastrar en el fondo`,"help.usage.select.ctrlRect.d":`Suma los elementos del rectángulo a la selección actual.`,"help.usage.select.clear.g":`Clic en el fondo / Esc`,"help.usage.select.clear.d":`Vacía la selección.`,"help.usage.edit.title":`Editar y eliminar`,"help.usage.edit.dbl.g":`Doble clic / F2 / Enter`,"help.usage.edit.dbl.d":`Edita el elemento: nombre, tipo, participantes de una relación (también ternarias) con su cardinalidad, participación y rol, subclases, atributo definidor, participación de una especialización, clave alternativa… Renombrar actualiza todas las referencias del código.`,"help.usage.edit.delete.g":`Supr`,"help.usage.edit.delete.d":`Elimina los elementos seleccionados y sus conexiones (pide confirmación).`,"help.usage.edit.undo.g":`Ctrl+Z / Ctrl+Y (o los botones ↶ ↷)`,"help.usage.edit.undo.d":`Deshace o rehace cualquier cambio: mover, crear, editar, eliminar, Limpiar o lo escrito en el código (agrupado por pausas). El historial se pierde al recargar la página.`,"help.usage.edit.blocked.g":`Código con errores`,"help.usage.edit.blocked.d":`Mientras el código tenga errores no se puede editar ni eliminar desde el diagrama: corrígelos primero (la barra inferior indica la línea).`,"help.usage.move.title":`Mover`,"help.usage.move.drag.g":`Arrastrar un elemento`,"help.usage.move.drag.d":`Lo mueve junto con sus atributos (incluidos los componentes de atributos compuestos).`,"help.usage.move.alt.g":`Alt + arrastrar`,"help.usage.move.alt.d":`Mueve solo el elemento, sin sus atributos.`,"help.usage.move.group.g":`Arrastrar un elemento seleccionado`,"help.usage.move.group.d":`Mueve toda la selección a la vez.`,"help.usage.navigate.title":`Navegar por el lienzo`,"help.usage.navigate.pan.g":`Botón derecho o central + arrastrar`,"help.usage.navigate.pan.d":`Desplaza el lienzo.`,"help.usage.navigate.wheel.g":`Rueda / Shift + rueda`,"help.usage.navigate.wheel.d":`Desplaza en vertical / en horizontal. En el touchpad, deslizar con dos dedos.`,"help.usage.navigate.zoom.g":`Ctrl + rueda / pellizco`,"help.usage.navigate.zoom.d":`Zoom centrado en el cursor.`,"help.usage.navigate.controls.g":`Controles − / + / ⟲ / ⤢`,"help.usage.navigate.controls.d":`Alejar, acercar, restablecer el zoom y ajustar el diagrama a la ventana.`,"help.usage.navigate.fullscreen.g":`Botón Pantalla completa`,"help.usage.navigate.fullscreen.d":`El editor ocupa toda la pantalla; Esc (o el mismo botón) para salir. En la app de escritorio es la ventana entera y también funciona F11. En Moodle quita los paneles laterales del curso; si el reproductor no lo permite, la app lo avisa y propone abrir la actividad en una ventana nueva.`,"help.usage.code.title":`Panel de código`,"help.usage.code.highlight.g":`Seleccionar un elemento`,"help.usage.code.highlight.d":`Resalta sus líneas (declaración y conexiones) y desplaza el editor hasta ellas.`,"help.usage.code.diagnostics.g":`Clic en la barra inferior`,"help.usage.code.diagnostics.d":`Salta a la línea del error o aviso que se muestra. Además de errores de sintaxis, avisa de errores de modelado frecuentes: entidad débil sin relación identificativa o sin clave parcial, relación recursiva sin roles, clave mal colocada… Los avisos no impiden seguir.`,"help.usage.code.coords.g":`Coordenadas (x, y)`,"help.usage.code.coords.d":`Son opcionales y se actualizan solas al arrastrar los elementos.`,"help.usage.relational.title":`Modelo relacional, SQL y archivos`,"help.usage.relational.tab.g":`Pestaña «Modelo Relacional»`,"help.usage.relational.tab.d":`Tablas generadas con los 9 pasos. Su código relacional también es editable (incluida la acción ON DELETE de cada FK).`,"help.usage.relational.types.g":`Tipos de columna`,"help.usage.relational.types.d":`El diagrama EER no tiene tipos: el modelo relacional los deduce. Si cambias un tipo en el código relacional (p. ej. NOMBRE VARCHAR2(50)), se conserva aunque luego modifiques el EER y se guarda en el archivo .eer. Las claves foráneas se escriben sin tipo y heredan siempre el de la columna a la que apuntan, así que basta con cambiar el de la clave primaria. Cualquier otro cambio en el código relacional (columnas o tablas añadidas a mano) se pierde al modificar el EER, porque el modelo se regenera desde él.`,"help.usage.relational.book.g":`Icono 📖 de una tabla`,"help.usage.relational.book.d":`Abre la Guía de 9 Pasos explicando qué regla generó esa tabla.`,"help.usage.relational.export.g":`Exportar SQL / Exportar SVG`,"help.usage.relational.export.d":`Script DDL para Oracle, PostgreSQL, MySQL, SQLite o ANSI, e imagen vectorial del diagrama.`,"help.usage.relational.files.g":`Men mpiler.invalidFKSyntax":`Invalid foreign key syntax (expected format: FK -> TABLE(COLUMN), or FK (A, B) -> TABLE(X, Y) with the same number of columns)`,"compiler.missingColumnType":`Column '{{col}}' has no type (e.g. NUMBER(10) or VARCHAR2(100)). Only a foreign key may omit it: it inherits the type of the column it references`,"compiler.undeclaredConstraintColumn":`Constraint column '{{col}}' is not declared in table '{{table}}'`,"compiler.fkNotReferencingKey":`The foreign key references ({{cols}}), which is neither the full primary key nor a UNIQUE key of '{{table}}': Oracle will reject it (ORA-02270)`,"compiler.fkTypeMismatch":`Column '{{col}}' is {{type}} but references {{ref}}, which is {{refType}}. Remove the type so that it is inherited`,"compiler.unresolvedFkType":`Cannot infer the type of foreign key '{{col}}' in '{{table}}': NUMBER(10) is used. Give the type or fix the reference`,"compiler.undeclaredTargetTable":`Target table '{{table}}' referenced in foreign key does not exist`,"compiler.undeclaredTargetColumn":`Target column '{{col}}' does not exist in table '{{table}}'`,"compiler.tableWithoutPK":`Table '{{name}}' has no primary key (PK)`,"compiler.duplicateTableName":`Table name '{{name}}' has already been declared`,"compiler.invalidReferentialAction":`Invalid ON DELETE action '{{action}}' (use CASCADE, SET NULL, RESTRICT or NO ACTION)`,"compiler.duplicateColumnName":`Column '{{col}}' already exists in table '{{table}}'`,"header.help":`Help`,"header.helpTooltip":`Help: editor usage, syntax, 9 steps, AI prompt and credits (F1)`,"help.title":`Help Center`,"help.subtitle":`Everything you need to use EER Studio`,"help.tab.usage":`Using the editor`,"help.tab.syntax":`Syntax`,"help.tab.steps":`9-Step Guide`,"help.tab.aiPrompt":`AI Prompt`,"help.tab.about":`About`,"help.close":`Close`,"help.f1Hint":`Press F1 at any time to open this help.`,"help.usage.intro":`EER Studio keeps the diagram and the DSL code in sync both ways: work with the mouse, the keyboard, or a mix of both.`,"help.usage.col.gesture":`Gesture`,"help.usage.col.action":`What it does`,"help.usage.create.title":`Creating elements`,"help.usage.create.tool.g":`Toolbar button + click on the canvas`,"help.usage.create.tool.d":`Opens a form to set up the entity, relationship, attribute, specialization or union at that point. If you first select an entity, relationship or attribute, the new attribute comes already attached to it in “Belongs to”.`,"help.usage.create.another.g":`"Add and create another"`,"help.usage.create.another.d":`In the attribute form: adds it and keeps the form ready for the next one with the same owner (entity, relationship or composite attribute), 100 px to the right.`,"help.usage.create.attrTypes.g":`Attribute type: partial key and alternate key`,"help.usage.create.attrTypes.d":`“Partial key” is the key of a weak entity (dashed underline). With the “Key” type, the “Alternate key (UNIQUE)” box marks a key that is not the primary one (UK in the diagram, NOT NULL + UNIQUE in the relational model).`,"help.usage.create.specPartial.g":`Specialization: “Total participation”`,"help.usage.create.specPartial.d":`Checked (default), every superclass entity belongs to some subclass: double line. Uncheck it for a partial specialization: single line.`,"help.usage.create.relAttr.g":`Attribute → "Belongs to" a relationship`,"help.usage.create.relAttr.d":`Creates relationship attributes. Key ones in an M:N or n-ary relationship become part of its table PK.`,"help.usage.create.composite.g":`Attribute → “Belongs to” another attribute`,"help.usage.create.composite.d":`Creates a composite attribute: first the composite (Address) attached to the entity, then each component (Street, Number) attached to it. Quickest: select Address in the diagram and use “Add and create another”. In the relational model the composite is replaced by its components.`,"help.usage.create.nary.g":`Relationship → “+ Add entity”`,"help.usage.create.nary.d":`Creates or edits ternary and higher-degree relationships. Each participant has cardinality, total participation and an optional role (useful in recursive relationships).`,"help.usage.create.code.g":`Typing in the code panel`,"help.usage.create.code.d":`The diagram is redrawn instantly. See the Syntax tab.`,"help.usage.select.title":`Selecting`,"help.usage.select.click.g":`Click an element`,"help.usage.select.click.d":`Selects it and highlights its lines in the code.`,"help.usage.select.ctrlClick.g":`Ctrl + click`,"help.usage.select.ctrlClick.d":`Adds or removes the element from the selection.`,"help.usage.select.rect.g":`Drag on the background`,"help.usage.select.rect.d":`Draws a rectangle and selects the elements fully inside it.`,"help.usage.select.ctrlRect.g":`Ctrl + drag on the background`,"help.usage.select.ctrlRect.d":`Adds the elements in the rectangle to the current selection.`,"help.usage.select.clear.g":`Click the background / Esc`,"help.usage.select.clear.d":`Clears the selection.`,"help.usage.edit.title":`Editing and deleting`,"help.usage.edit.dbl.g":`Double-click / F2 / Enter`,"help.usage.edit.dbl.d":`Edits the element: name, type, the participants of a relationship (ternary ones too) with their cardinality, participation and role, subclasses, defining attribute, a specialization's participation, alternate key… Renaming updates every reference in the code.`,"help.usage.edit.delete.g":`Delete`,"help.usage.edit.delete.d":`Deletes the selected elements and their connections (asks for confirmation).`,"help.usage.edit.undo.g":`Ctrl+Z / Ctrl+Y (or the ↶ ↷ buttons)`,"help.usage.edit.undo.d":`Undoes or redoes any change: moving, creating, editing, deleting, Clear or what you typed in the code (grouped by pauses). The history is lost when the page is reloaded.`,"help.usage.edit.blocked.g":`Code with errors`,"help.usage.edit.blocked.d":`While the code has errors, elements cannot be edited or deleted from the diagram: fix them first (the bottom bar shows the line).`,"help.usage.move.title":`Moving`,"help.usage.move.drag.g":`Drag an element`,"help.usage.move.drag.d":`Moves it together with its attributes (including components of composite attributes).`,"help.usage.move.alt.g":`Alt + drag`,"help.usage.move.alt.d":`Moves only the element, without its attributes.`,"help.usage.move.group.g":`Drag a selected element`,"help.usage.move.group.d":`Moves the whole selection at once.`,"help.usage.navigate.title":`Navigating the canvas`,"help.usage.navigate.pan.g":`Right or middle button + drag`,"help.usage.navigate.pan.d":`Pans the canvas.`,"help.usage.navigate.wheel.g":`Wheel / Shift + wheel`,"help.usage.navigate.wheel.d":`Scrolls vertically / horizontally. On a touchpad, swipe with two fingers.`,"help.usage.navigate.zoom.g":`Ctrl + wheel / pinch`,"help.usage.navigate.zoom.d":`Zooms around the cursor.`,"help.usage.navigate.controls.g":`Controls − / + / ⟲ / ⤢`,"help.usage.navigate.controls.d":`Zoom out, zoom in, reset zoom and fit the diagram to the window.`,"help.usage.navigate.fullscreen.g":`Full screen button`,"help.usage.navigate.fullscreen.d":`The editor fills the whole screen; Esc (or the same button) to exit. In the desktop app it is the whole window and F11 also works. In Moodle it removes the course side panels; if the player does not allow it, the app says so and suggests opening the activity in a new window.`,"help.usage.code.title":`Code panel`,"help.usage.code.highlight.g":`Select an element`,"help.usage.code.highlight.d":`Highlights its lines (declaration and connections) and scrolls the editor to them.`,"help.usage.code.diagnostics.g":`Click the bottom bar`,"help.usage.code.diagnostics.d":`Jumps to the line of the error or warning shown. Besides syntax errors, it warns about common modelling mistakes: weak entity without an identifying relationship or partial key, recursive relationship without roles, misplaced key… Warnings do not stop you.`,"help.usage.code.coords.g":`Coordinates (x, y)`,"help.usage.code.coords.d":`They are optional and update themselves when you drag elements.`,"help.usage.relational.title":`Relational model, SQL and files`,"help.usage.relational.tab.g":`"Relational Model" tab`,"help.usage.relational.tab.d":`Tables generated with the 9 steps. Their relational code is editable too (including the ON DELETE action of each FK).`,"help.usage.relational.types.g":`Column types`,"help.usage.relational.types.d":`The EER diagram has no types: the relational model infers them. If you change a type in the relational code (e.g. NAME VARCHAR2(50)), it is kept even if you later edit the EER, and it is saved in the .eer file. Foreign keys are written without a type and always inherit the type of the column they point to, so changing the primary key is enough. Any other change in the relational code (columns or tables added by hand) is lost when you edit the EER, because the model is regenerated from it.`,"help.usage.relational.book.g":`📖 icon on a table`,"help.usage.relational.book.d":`Opens the 9-Step Guide explaining which rule produced that table.`,"help.usage.relational.export.g":`Export SQL / Export SVG`,"help.usage.relational.export.d":`DDL script for Oracle, PostgreSQL, MySQL, SQLite or ANSI, and a vector image of the diagram.`,"help.usage.relational.files.g":`File menu`,"help.usage.relational.files.d":`Opens and saves .eer files with the diagram and the table positions.`,"help.usage.shortcuts.title":`Keyboard shortcuts`,"help.usage.shortcuts.f1":`Open this help`,"help.usage.shortcuts.f2":`Edit the selected element`,"help.usage.shortcuts.delete":`Delete the selection`,"help.usage.shortcuts.esc":`Clear the selection`,"help.usage.shortcuts.undo":`Undo`,"help.usage.shortcuts.redo":`Redo`,"help.usage.shortcuts.enter":`In a form: confirm`,"help.usage.key.delete":`Delete`,"help.usage.key.esc":`Esc`,"modalHelp.eer.unionSuper.desc":`Connects a superclass to the union.`,"modalHelp.eer.unionCategory.desc":`Connects the union to its category (resulting subclass).`,"modalHelp.rel.fkMandatory.desc":`Mandatory FK: NO ACTION prevents deleting the referenced row while it has related rows.`,"modalCredits.collaboratorsTitle":`Contributors:`,"modalCredits.collaborator.enrique":`proposals for version 1.6.0 (visual editing, selection, ON DELETE policy and more).`,"modalCredits.theoryText.and":`and`,"modalCredits.version":`Version {{version}}`,"errorBoundary.title":`An unexpected error occurred`,"errorBoundary.subtitle":`The editor contained the error to protect your work. You can copy the technical report or reload the application.`,"errorBoundary.copyCode":`Copy technical report`,"errorBoundary.copied":`Report copied!`,"errorBoundary.restore":`Reload application`,"moodle.title.default":`EER modelling exam`,"moodle.version":`v{{version}}`,"moodle.copy":`Copy for submission`,"moodle.copy.tooltip":`Copies your diagram so you can paste it into the online text of the Moodle assignment`,"moodle.download":`Download .eer`,"moodle.download.tooltip":`Downloads the diagram as a file (if the assignment accepts file submissions)`,"moodle.fullscreen":`Full screen`,"moodle.fullscreen.exit":`Exit full screen`,"moodle.fullscreen.tooltip":`The editor fills the whole screen, without the Moodle panels (Esc to exit)`,"moodle.fullscreen.unavailable":`Moodle does not allow full screen in this player. Collapse its side panels or ask your teacher to open the activity in a new window.`,"moodle.load":`Load submission`,"moodle.load.tooltip":`Rebuilds a diagram from a copied submission block`,"moodle.reset":`Start over`,"moodle.reset.tooltip":`Discards the diagram and goes back to the exam starting template`,"moodle.status.copied":`Copied. Paste it (Ctrl+V) into the online text of the assignment and click "Submit assignment".`,"moodle.status.restored":`Your work saved in this browser has been restored.`,"moodle.status.autosaveOff":`This browser does not allow autosave: do not reload the page and submit before closing it.`,"moodle.status.loaded":`Submission loaded; the checksum is correct.`,"moodle.status.loaded ### Reglas de Sintaxis de EER Studio:

**IMPORTANTE:** Todos los elementos (entidades, atributos, relaciones, jerarquías) pueden llevar coordenadas opcionales: \`ELEMENTO NOMBRE (x, y)\`
**Longitud:** Usa nombres de entidades/atributos/relaciones con ≤15 caracteres para que quepan en las elipses/rectángulos.

1) Entidades
- Fuerte: \`ent EMPLEADO (100, 200)\`
- Débil: \`weak_ent CONTRATO (150, 350)\`

2) Atributos
- Simple: \`att Nombre -> EMPLEADO (120, 80)\` (alejado de la entidad)
- Clave: \`key_att DNI -> EMPLEADO (50, 80)\` (varios key_att en la misma entidad forman una clave compuesta)
- Clave alternativa: \`key_att Email -> EMPLEADO unique (50, 20)\` (UNIQUE NOT NULL, no forma la PK)
- Clave parcial de entidad débil: \`partial_key_att NumLinea -> LINEA (150, 420)\`
- Compuesto: \`att Direccion -> EMPLEADO (300, 80)\` y sus componentes \`att Calle -> Direccion (280, 20)\`, \`att Numero -> Direccion (340, 20)\`
- Derivado: \`derived_att Edad -> EMPLEADO (190, 80)\`
- Multivaluado: \`multivalued_att Telefono -> EMPLEADO (260, 80)\`
- De relación: \`att Fecha -> TRABAJA_EN (250, 120)\` (la flecha apunta a la relación). Si es clave (\`key_att\`) en una relación M:N o n-aria, forma parte de la PK de la tabla de la relación (ej. \`key_att Vuelta -> CIRCULA\`)

3) Relaciones
- Normal: \`rel TRABAJA_EN (250, 200)\` (centrada entre entidades)
- Identificativa: \`ident_rel POSEE (200, 350)\` (para entidad débil)

4) Conexiones
- Sintaxis: \`link ENTIDAD RELACION "CARDINALIDAD" [opcional:total]\`
- Ejemplo: \`link EMPLEADO TRABAJA_EN "N" [total]\`
- Rol (obligatorio en relaciones recursivas): \`link EMPLEADO SUPERVISA "1" role:Supervisor\` y \`link EMPLEADO SUPERVISA "N" role:Supervisado\`
- Relación ternaria: tres líneas link hacia la misma relación

5) Jerarquías
- Definir especialización: \`spec TIPO -> SUPERCLASE\` (TIPO: 'd' disjunta, 'o' solapada)
- Especialización definida por atributo: \`spec d -> EMPLEADO [TipoTrabajo]\` (el atributo definidor va entre corchetes; omítelos si la especialización es definida por el usuario)
- Especialización parcial (línea simple): \`spec o -> EMPLEADO partial\` (sin palabra es total, doble línea)
- Conectar subclases: \`link TIPO SUBCLASE\`

6) Uniones (categorías)
- Definir unión: \`union u\`
- Conectar superclases: \`link SUPERCLASE u\`
- Conectar categoría: \`link u CATEGORIA\`

### 📏 Guía de espaciado para evitar solapes
- Atributos en fila superior: Y = entidad_Y - 130 a -160; máx 4 por fila; X +100px entre atributos; si hay más, abre segunda fila superior 40–60px más arriba y resetea X.
- Atributos en laterales/columna: usa cuando haya >6 atributos; pon 3–4 a la izquierda (X = entidad_X - 130..140) y 3–4 a la derecha (X = entidad_X + 130..140); Y escalonado cada 70–80px.
- Entidades: separa 320–360px en X y 260–320px en Y; si una entidad tiene muchos atributos, súbela o bájala ±80–120px respecto a sus vecinas para evitar colisiones de filas.
- Relaciones: punto medio entre entidades; deja ≥180px de separación respecto a cada entidad si hay muchas aristas.

### EER Studio Syntax Rules:

**IMPORTANT:** Every element (entities, attributes, relationships, hierarchies) can take optional coordinates: \`ELEMENT NAME (x, y)\`
**Length:** Use entity/attribute/relationship names of ≤15 characters so they fit inside the ellipses/rectangles.
**Keywords:** the DSL commands (\`ent\`, \`att\`, \`rel\`, \`link\`, \`spec\`, \`union\`…) are fixed and must NOT be translated. Element names may be in any language.

1) Entities
- Strong: \`ent EMPLOYEE (100, 200)\`
- Weak: \`weak_ent CONTRACT (150, 350)\`

2) Attributes
- Simple: \`att Name -> EMPLOYEE (120, 80)\` (away from the entity)
- Key: \`key_att SSN -> EMPLOYEE (50, 80)\` (several key_att on the same entity form a composite key)
- Alternate key: \`key_att Email -> EMPLOYEE unique (50, 20)\` (UNIQUE NOT NULL, not part of the PK)
- Partial key of a weak entity: \`partial_key_att LineNo -> LINE (150, 420)\`
- Composite: \`att Address -> EMPLOYEE (300, 80)\` and its components \`att Street -> Address (280, 20)\`, \`att Number -> Address (340, 20)\`
- Derived: \`derived_att Age -> EMPLOYEE (190, 80)\`
- Multivalued: \`multivalued_att Phone -> EMPLOYEE (260, 80)\`
- Relationship attribute: \`att Date -> WORKS_IN (250, 120)\` (the arrow points to the relationship). If it is a key (\`key_att\`) in an M:N or n-ary relationship, it becomes part of the PK of the relationship table (e.g. \`key_att Lap -> RACES\`)

3) Relationships
- Regular: \`rel WORKS_IN (250, 200)\` (centred between entities)
- Identifying: \`ident_rel OWNS (200, 350)\` (for a weak entity)

4) Connections
- Syntax: \`link ENTITY RELATIONSHIP "CARDINALITY" [optional:total]\`
- Example: \`link EMPLOYEE WORKS_IN "N" [total]\`
- Role (required in recursive relationships): \`link EMPLOYEE SUPERVISES "1" role:Supervisor\` and \`link EMPLOYEE SUPERVISES "N" role:Supervisee\`
- Ternary relationship: three link lines to the same relationship

5) Hierarchies
- Define a specialization: \`spec TYPE -> SUPERCLASS\` (TYPE: 'd' disjoint, 'o' overlapping)
- Attribute-defined specialization: \`spec d -> EMPLOYEE [JobType]\` (the defining attribute goes in brackets; omit them if the specialization is user-defined)
- Partial specialization (single line): \`spec o -> EMPLOYEE partial\` (without the word it is total, double line)
- Connect subclasses: \`link TYPE SUBCLASS\`

6) Unions (categories)
- Define a union: \`union u\`
- Connect superclasses: \`link SUPERCLASS u\`
- Connect the category: \`link u CATEGORY\`

### 📏 Spacing guide to avoid overlaps
- Attributes in a top row: Y = entity_Y - 130 to -160; max 4 per row; X +100px between attributes; if there are more, open a second top row 40–60px higher and reset X.
- Attributes on the sides/column: use it when there are >6 attributes; put 3–4 on the left (X = entity_X - 130..140) and 3–4 on the right (X = entity_X + 130..140); stagger Y every 70–80px.
- Entities: separate them 320–360px in X and 260–320px in Y; if an entity has many attributes, move it up or down ±80–120px relative to its neighbours to avoid row collisions.
- Relationships: midpoint between entities; leave ≥180px from each entity if there are many edges.
